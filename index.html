<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danyslar - Cadastro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f3f3;
      color: #07133f;
    }

    .pagina {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background: white;
      min-height: 100vh;
      padding: 18px;
    }

    .topo img {
      width: 100%;
      display: block;
      border-radius: 4px;
      object-fit: contain;
    }

    .cadastro {
      margin: 22px auto;
      max-width: 650px;
      padding: 25px;
      border: 2px solid #07133f;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 4px 14px rgba(0,0,0,.10);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
    }

    .subtitulo {
      text-align: center;
      margin: 0 0 22px;
      color: #555;
    }

    .campo { margin-bottom: 15px; }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #aaa;
      border-radius: 7px;
      font-size: 16px;
    }

    input:focus, select:focus {
      outline: 2px solid #ff6b00;
      border-color: #ff6b00;
    }

    .linha {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #ff6800;
      color: white;
      font-size: 18px;
      <form id="formCadastro" onsubmit="return false;">
      cursor: pointer;
    }

    button:hover { background: #e85d00; }

    #mensagem {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      background: #e8f7e8;
      color: #176b17;
      text-align: center;
      font-weight: bold;
    }

    .baixo {
      margin-top: 10px;
    }

    .baixo img {
      width: 100%;
      display: block;
      border-radius: 4px;
    }

    @media (max-width: 600px) {
      .pagina { padding: 8px; }
      .cadastro { padding: 18px; }
      .linha { grid-template-columns: 1fr; gap: 0; }
      h1 { font-size: 24px; }
    }
  </style>
</head>

<body>
  <main class="pagina">

    <!-- PRIMEIRA IMAGEM: LOGO NO TOPO -->
    <div class="topo">
      <img src="logo.png" alt="Danyslar">
    </div>

    <!-- FORMULÁRIO DE CADASTRO -->
    <section class="cadastro">
      <h1>Cadastro</h1>
      <p class="subtitulo">Preencha seus dados para continuar</p>

      <form id="formCadastro">
        <div class="linha">
          <div class="campo">
            <label for="nome">Nome completo</label>
            <input id="nome" name="nome" type="text" placeholder="Digite seu nome" required>
          </div>

          <div class="campo">
            <label for="cpf">CPF</label>
            <input id="cpf" name="cpf" type="text" inputmode="numeric"
                   placeholder="000.000.000-00" maxlength="14" required>
          </div>
        </div>

        <div class="linha">
          <div class="campo">
            <label for="telefone">Telefone</label>
            <input id="telefone" name="telefone" type="tel"
                   placeholder="(00) 00000-0000" required>
          </div>

          <div class="campo">
            <label for="nascimento">Data de nascimento</label>
            <input id="nascimento" name="nascimento" type="date" required>
          </div>
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email"
                 placeholder="seuemail@exemplo.com" required>
        </div>

        <div class="campo">
          <label for="cidade">Cidade</label>
          <input id="cidade" name="cidade" type="text"
                 placeholder="Digite sua cidade" required>
        </div>

        <div class="campo">
          <label for="renda">Renda mensal</label>
          <select id="renda" name="renda" required>
            <option value="">Selecione</option>
            <option>Até R$ 1.500</option>
            <option>R$ 1.501 a R$ 3.000</option>
            <option>R$ 3.001 a R$ 5.000</option>
            <option>Acima de R$ 5.000</option>
          </select>
        </div>

        <button type="submit">CONTINUAR CADASTRO</button>
        <div id="mensagem">Cadastro preenchido com sucesso!</div>
      </form>
    </section>

    <!-- SEGUNDA IMAGEM: BANNER ABAIXO DO CADASTRO -->
    <div class="baixo">
      <img src="banner.jpg" alt="Crédito aprovado na hora - Danyslar">
    </div>

  </main>

  <script>
    // Máscara simples para CPF
    document.getElementById("cpf").addEventListener("input", function () {
      let v = this.value.replace(/\D/g, "").slice(0, 11);
      v = v.replace(/(\d{3})(\d)/, "$1.$2");
      v = v.replace(/(\d{3})(\d)/, "$1.$2");
      v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
      this.value = v;
    });

    document.getElementById("formCadastro").addEventListener("submit", function(e) {

    e.preventDefault();

    if (!this.checkValidity()) {
        this.reportValidity();
        return;
    }

        document.getElementById("mensagem").style.display = "block";
    document.getElementById("mensagem").textContent =
        "Cadastro preenchido com sucesso!";

});
</script>
